name: Photo2Fresh 1.2.2 Signed ARM64

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out source and Git LFS models
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f settings.gradle.kts || -f settings.gradle ]]; then
            dir="."
          elif [[ -f Photo2Fresh-1.2.1-en-zh/Photo2Fresh/settings.gradle.kts || -f Photo2Fresh-1.2.1-en-zh/Photo2Fresh/settings.gradle ]]; then
            dir="Photo2Fresh-1.2.1-en-zh/Photo2Fresh"
          else
            echo 'No settings.gradle(.kts) found in repository root or Photo2Fresh/.' >&2
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Project directory: $dir"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Validate model assets
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ['PROJECT_DIR'])
          base = root / 'app/src/main/assets'
          expected = [
              'models/indian_flying_pancake_1280.onnx',
              'models/hydralisk_seg_1024_final.onnx',
              '肉类新鲜度/公共图像特征.onnx',
              '肉类新鲜度/猪肉_25摄氏度_双目标.onnx',
              '肉类新鲜度/猪肉_4摄氏度_双目标.onnx',
              '肉类新鲜度/牛肉_25摄氏度_双目标.onnx',
              '肉类新鲜度/牛肉_4摄氏度_双目标.onnx',
              '肉类新鲜度/鸡肉_25摄氏度_双目标.onnx',
              '肉类新鲜度/鸡肉_4摄氏度_双目标.onnx',
              '肉类新鲜度/模型配置.json',
              '肉类新鲜度/预处理自检.json',
          ]
          for relative in expected:
              path = base / relative
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'Missing or empty model asset: {path}')
              if path.open('rb').read(80).startswith(b'version https://git-lfs.github.com/spec/v1'):
                  raise SystemExit(f'Git LFS pointer was not downloaded: {path}')
              print(f'OK {relative}: {path.stat().st_size:,} bytes')
          PY
          if [[ -f "$PROJECT_DIR/tools/check_model_assets.py" ]]; then
            (cd "$PROJECT_DIR" && python3 tools/check_model_assets.py)
          fi

      - name: Build ARM64 Debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" :app:assembleDebug \
            --no-daemon --max-workers=2 --stacktrace \
            -Pkotlin.incremental=false \
            -Dorg.gradle.jvmargs='-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            2>&1 | tee "$RUNNER_TEMP/photo2fresh-build.log"

      - name: Select ARM64 APK and verify nine ONNX files
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import shutil
          from pathlib import Path
          from zipfile import ZipFile

          root = Path(os.environ['PROJECT_DIR'])
          output = root / 'app/build/outputs/apk/debug'
          apks = sorted(output.rglob('*.apk')) if output.exists() else []
          if not apks:
              raise SystemExit(f'No APK found in {output}')

          models = [
              'models/indian_flying_pancake_1280.onnx',
              'models/hydralisk_seg_1024_final.onnx',
              '肉类新鲜度/公共图像特征.onnx',
              '肉类新鲜度/猪肉_25摄氏度_双目标.onnx',
              '肉类新鲜度/猪肉_4摄氏度_双目标.onnx',
              '肉类新鲜度/牛肉_25摄氏度_双目标.onnx',
              '肉类新鲜度/牛肉_4摄氏度_双目标.onnx',
              '肉类新鲜度/鸡肉_25摄氏度_双目标.onnx',
              '肉类新鲜度/鸡肉_4摄氏度_双目标.onnx',
          ]

          def sha256_of(stream):
              digest = hashlib.sha256()
              while True:
                  data = stream.read(1024 * 1024)
                  if not data:
                      return digest.digest()
                  digest.update(data)

          matches = {'arm64-v8a': []}
          for apk in apks:
              with ZipFile(apk, metadata_encoding='utf-8') as z:
                  abis = {
                      p.split('/')[1]
                      for p in z.namelist()
                      if p.startswith('lib/') and p.endswith('.so')
                      and len(p.split('/')) >= 3
                  }
                  print(f'{apk}: native ABIs = {sorted(abis)}')
                  if len(abis) == 1:
                      abi = next(iter(abis))
                      if abi in matches:
                          matches[abi].append(apk)

          for abi in matches:
              candidates = matches[abi]
              if len(candidates) != 1:
                  raise SystemExit(
                      f'Expected exactly one independent {abi} APK, found {len(candidates)}. '
                      'Check app/build.gradle(.kts) ABI splits and build outputs. '
                      'A universal APK must not be mislabelled as an ABI-only APK.'
                  )

          staging = Path(os.environ['RUNNER_TEMP']) / 'p2f-unsigned'
          staging.mkdir(parents=True, exist_ok=True)
          names = {
              'arm64-v8a': 'Photo2Fresh-v1.2.2-code14-ARM64-unsigned.apk',
          }
          for abi, candidates in matches.items():
              apk = candidates[0]
              with ZipFile(apk, metadata_encoding='utf-8') as z:
                  archived = set(z.namelist())
                  for relative in models:
                      entry = f'assets/{relative}'
                      if entry not in archived:
                          raise SystemExit(f'{abi}: missing {entry}')
                      with (root / 'app/src/main/assets' / relative).open('rb') as src, z.open(entry) as dst:
                          if sha256_of(src) != sha256_of(dst):
                              raise SystemExit(f'{abi}: SHA256 mismatch for {entry}')
                  for extra in ('肉类新鲜度/模型配置.json', '肉类新鲜度/预处理自检.json'):
                      if f'assets/{extra}' not in archived:
                          raise SystemExit(f'{abi}: missing assets/{extra}')
              destination = staging / names[abi]
              shutil.copy2(apk, destination)
              print(f'Checked {abi}: 9 ONNX hashes OK; staged {destination.name}')
          PY

      - name: Sign ARM64 APK and check signature
        shell: bash
        env:
          P2F_KEYSTORE_B64: ${{ secrets.P2F_KEYSTORE_B64 }}
          P2F_STORE_PASSWORD: ${{ secrets.P2F_STORE_PASSWORD }}
          P2F_KEY_ALIAS: ${{ secrets.P2F_KEY_ALIAS }}
          P2F_KEY_PASSWORD: ${{ secrets.P2F_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${P2F_KEYSTORE_B64:?Missing P2F_KEYSTORE_B64 secret}"
          : "${P2F_STORE_PASSWORD:?Missing P2F_STORE_PASSWORD secret}"
          : "${P2F_KEY_PASSWORD:?Missing P2F_KEY_PASSWORD secret}"
          umask 077
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK unavailable}}"
          apksigner="$sdk_root/build-tools/36.0.0/apksigner"
          zipalign="$sdk_root/build-tools/36.0.0/zipalign"
          aapt="$sdk_root/build-tools/36.0.0/aapt"
          keyfile="$RUNNER_TEMP/p2f-signing.jks"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$P2F_KEYSTORE_B64" | base64 --decode > "$keyfile"
          test -s "$keyfile"

          mkdir -p "$RUNNER_TEMP/p2f-signed"
          for entry in 'arm64-v8a:ARM64'; do
            abi="${entry%%:*}"
            label="${entry##*:}"
            src="$RUNNER_TEMP/p2f-unsigned/Photo2Fresh-v1.2.2-code14-${label}-unsigned.apk"
            dest="$RUNNER_TEMP/p2f-signed/Photo2Fresh-v1.2.2-code14-${label}-signed.apk"
            echo "Signing $abi"
            "$zipalign" -c -P 16 4 "$src"
            "$apksigner" sign \
              --ks "$keyfile" \
              --ks-pass env:P2F_STORE_PASSWORD \
              --key-pass env:P2F_KEY_PASSWORD \
              --v4-signing-enabled false \
              --out "$dest" "$src"
            "$apksigner" verify --verbose --print-certs "$dest" \
              > "$RUNNER_TEMP/p2f-signature-$label.txt"
            "$zipalign" -c -P 16 4 "$dest"
            cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/p2f-signature-$label.txt" | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            expected='53af77e1cefb8915586e077c675f74351a9b4cdf76628fc095c7dd5495816294'
            if [[ "$cert" != "$expected" ]]; then
              echo "Incorrect release certificate for $abi (actual $cert, expected $expected)" >&2
              exit 1
            fi
            badging="$($aapt dump badging "$dest" | head -n 1)"
            echo "$badging"
            [[ "$badging" == *"versionCode='14'"* ]] || { echo 'versionCode is not 14' >&2; exit 1; }
            [[ "$badging" == *"versionName='1.2.2'"* ]] || { echo 'versionName is not 1.2.2' >&2; exit 1; }
            echo "Signed and verified: $(basename "$dest")"
          done

      - name: Upload signed ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Photo2Fresh-1.2.2-14-ARM64-signed
          path: ${{ runner.temp }}/p2f-signed/Photo2Fresh-v1.2.2-code14-ARM64-signed.apk
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Photo2Fresh-build-diagnostics
          path: |
            ${{ runner.temp }}/photo2fresh-build.log
            ${{ steps.project.outputs.dir }}/app/build/reports
          if-no-files-found: ignore
          retention-days: 3
